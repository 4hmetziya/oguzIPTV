<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oguzIPTV</title>
    <link rel="stylesheet" href="style.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <header>
        <img src="logo.png" alt="oguzIPTV Logo" class="main-logo">
        <div id="top-nav">
            <button id="nav-live" class="nav-button active" tabindex="10">Live TV</button>
            <button id="nav-movies" class="nav-button" tabindex="11">Movies</button>
            <button id="nav-series" class="nav-button" tabindex="12">Series</button>
            <button id="nav-search" class="nav-button" tabindex="13">Search</button>
        </div>
    </header>
    <main>
        <div id="login-container">
            <div class="tabs">
                <button id="tab-xtream" class="tab-button active" tabindex="1">Xtream Codes</button>
                <button id="tab-m3u" class="tab-button" tabindex="2">M3U URL</button>
            </div>

            <div id="xtream-section" class="login-section active">
                <div class="input-group">
                    <label for="server-url">Server URL</label>
                    <input type="text" id="server-url" tabindex="3" placeholder="http://example.com">
                </div>
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" tabindex="4" placeholder="Enter username">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" tabindex="5" placeholder="Enter password">
                </div>
            </div>

            <div id="m3u-section" class="login-section">
                <div class="input-group">
                    <label for="playlist-url">Playlist URL</label>
                    <input type="text" id="playlist-url" tabindex="6" placeholder="http://example.com/playlist.m3u">
                </div>
            </div>

            <button id="connect-btn" class="connect-button" tabindex="7">Connect</button>

            <div id="loading-indicator" style="display: none;">
                <div class="spinner"></div>
                <p>Yükleniyor...</p>
            </div>

            <div id="error-message" style="display: none;"></div>
        </div>

        <div id="main-content" style="display: none;">
            <div id="content-wrapper">
                <div id="sidebar"></div>
                <div id="right-pane">
                    <div id="search-container" style="display: none;">
                        <input type="text" id="search-input" placeholder="Search..." tabindex="14">
                    </div>
                    <div id="channel-list"></div>
                </div>
            </div>
        </div>
    </main>
    
    <video id="video-player" controls autoplay style="display: none;"></video>

    <div id="player-osd" style="display: none;">
        <div class="osd-section">
            <h3>Audio Tracks</h3>
            <div id="audio-tracks-list" class="osd-list"></div>
        </div>
        <div class="osd-section">
            <h3>Subtitles</h3>
            <div id="subtitle-tracks-list" class="osd-list"></div>
        </div>
    </div>

    <div id="resume-modal" style="display: none;">
        <div class="modal-content">
            <h2>Resume Playback?</h2>
            <p>You stopped watching at <span id="resume-time"></span></p>
            <div class="modal-buttons">
                <button id="btn-resume" class="modal-btn focused" tabindex="15">Resume</button>
                <button id="btn-restart" class="modal-btn" tabindex="16">Start Over</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=4"></script>
</body>
</html>
